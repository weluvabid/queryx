name: Continuous Benchmarking

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: bencher-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: QueryX benchmarks
    runs-on: ubuntu-latest
    env:
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
      BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
      BENCHER_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Bencher CLI
        uses: bencherdev/bencher@main

      - name: Run and report benchmarks
        if: ${{ env.BENCHER_API_KEY != '' && env.BENCHER_PROJECT != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bencher run
          --project "$BENCHER_PROJECT"
          --branch "$BENCHER_BRANCH"
          --hash "$GITHUB_SHA"
          --testbed github-hosted-ubuntu-latest
          --adapter json
          --file bencher-results.json
          --github-actions "$GITHUB_TOKEN"
          --ci-id "queryx-${GITHUB_EVENT_NAME}"
          "npm run bench:bencher"
